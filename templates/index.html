<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8th Anniversary Frame</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<style>

/* =============================
   GLOBAL DESIGN
============================= */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #120000, #2b0000);
    color: white;
    overflow-x: hidden;
}

/* =============================
   CINEMATIC INTRO
============================= */

#introScreen {
    position: fixed;
    width: 100%;
    height: 100vh;
    background: radial-gradient(circle at center, #300000 0%, #000000 80%);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 9999;
    animation: fadeOut 1.5s ease-in-out 6s forwards;
    overflow: hidden;
}

/* Floating particles */
#introScreen::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background-image: radial-gradient(rgba(255,215,0,0.15) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: moveParticles 20s linear infinite;
}

@keyframes moveParticles {
    from { transform: translate(0,0); }
    to { transform: translate(-200px,-200px); }
}

.intro-content {
    position: relative;
    z-index: 2;
    opacity: 0;
    transform: scale(0.7);
    animation: cinematicReveal 2.5s ease forwards;
}

/* Logo Pulse */
.logo-wrapper {
    margin-bottom: 25px;
}

#introLogo {
    width: 150px;
    filter: drop-shadow(0 0 25px gold);
    animation: logoPulse 2s ease-in-out infinite alternate;
}

@keyframes logoPulse {
    from { transform: scale(1); filter: drop-shadow(0 0 10px gold); }
    to { transform: scale(1.08); filter: drop-shadow(0 0 35px gold); }
}

.intro-content h1 {
    font-size: 18px;
    letter-spacing: 4px;
    opacity: 0.8;
}

.intro-content h2 {
    font-size: 56px;
    font-weight: 900;
    text-transform: uppercase;
    background: linear-gradient(90deg, gold, #fff3b0, gold);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 15px 0;
    position: relative;
}

.intro-content h3 {
    font-size: 24px;
    letter-spacing: 5px;
}

@keyframes cinematicReveal {
    0% { opacity: 0; transform: scale(0.6); }
    60% { opacity: 1; transform: scale(1.05); }
    100% { opacity: 1; transform: scale(1); }
}

@keyframes fadeOut {
    to { opacity: 0; visibility: hidden; }
}

/* =============================
   LIGHT ELEGANT HOME DESIGN
============================= */

.main-wrapper {
    padding: 80px 20px;
    text-align: center;
    background: linear-gradient(135deg, #fffdf8, #f5f0e6);
    min-height: 100vh;
    color: #4a0000;
}

.app-card {
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    padding: 50px 40px;
    max-width: 520px;
    margin: auto;
    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    border: 1px solid rgba(180,150,100,0.2);
}

.app-card h2 {
    font-size: 30px;
    margin-bottom: 30px;
    font-weight: 700;
    color: #7a0000;
}

input[type="file"] {
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #ddd;
    width: 100%;
    margin-bottom: 25px;
    background: #fff;
}

button {
    background: linear-gradient(90deg, #8b0000, #b22222);
    border: none;
    padding: 15px;
    border-radius: 40px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: all 0.3s ease;
    color: white;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(139,0,0,0.3);
}

.crop-container {
    max-width: 350px;
    margin: 25px auto;
}

canvas {
    margin-top: 25px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.download-btn {
    margin-top: 25px;
}

</style>
</head>

<body>

<!-- ULTRA CINEMATIC INTRO -->
<div id="introScreen">
    <div class="intro-content">
        <div class="logo-wrapper">
            <img src="static/logo.png" alt="MBC Logo" id="introLogo">
        </div>
        <h1>Proudly Presented By</h1>
        <h2>Digital Marketing Department</h2>
        <h3>Mahamevnawa Buddhist College</h3>
    </div>
</div>

<!-- MODERN HOME UI -->
<div class="main-wrapper">
    <div class="app-card">
        <h2>8th Anniversary Frame</h2>

        <input type="file" id="imageUpload" accept="image/*">

        <div class="crop-container">
            <img id="imagePreview" style="display:none; max-width:100%;">
        </div>

        <button id="applyFrameBtn" style="display:none;">Apply Frame</button>

        <canvas id="canvasResult"></canvas>

        <div class="download-btn">
            <a id="downloadBtn" href="#" download="framed.png" style="display:none;">
                <button>Download Image</button>
            </a>
        </div>
    </div>
</div>

<script>
const imageUpload = document.getElementById("imageUpload");
const imagePreview = document.getElementById("imagePreview");
const applyFrameBtn = document.getElementById("applyFrameBtn");
const canvasResult = document.getElementById("canvasResult");
const downloadBtn = document.getElementById("downloadBtn");
let cropper;

imageUpload.addEventListener("change", function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        imagePreview.src = e.target.result;
        imagePreview.style.display = "block";

        if (cropper) cropper.destroy();

        cropper = new Cropper(imagePreview, {
            aspectRatio: 1,
            viewMode: 1,
            zoomable: true,
            movable: true,
            autoCropArea: 1,
            background: false
        });

        applyFrameBtn.style.display = "block";
    };
    reader.readAsDataURL(file);
});

applyFrameBtn.addEventListener("click", function() {
    if (!cropper) return;

    const croppedCanvas = cropper.getCroppedCanvas({
        width: 500,
        height: 500
    });

    const ctx = canvasResult.getContext("2d");
    canvasResult.width = 500;
    canvasResult.height = 500;

    ctx.drawImage(croppedCanvas, 0, 0, 500, 500);

    const frameImg = new Image();
    frameImg.src = "static/frame.png";
    frameImg.onload = function() {
        ctx.drawImage(frameImg, 0, 0, 500, 500);

        const finalImage = canvasResult.toDataURL("image/png");
        downloadBtn.href = finalImage;
        downloadBtn.style.display = "block";
    };
});
</script>

</body>
</html>
